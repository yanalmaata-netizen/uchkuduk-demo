<body>
<title>Балык Контур</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Golos+Text:wght@500;600;700&family=Commissioner:wght@400;500&family=JetBrains+Mono:wght@400;600&display=swap">
<style>
  :root{
    --bg:#F2EFEC; --surface:#FFFFFF; --sunk:#F8F5F2; --ink:#1E1512; --muted:#6E6058;
    --line:#E0D8D2; --line-soft:#EDE7E2;
    --teal:#A8412A; --teal-soft:#F6E5DF; --teal-ink:#FFFFFF;
    --copper:#8C3B12; --copper-soft:#F8E6D9;
    --good:#25714E; --good-soft:#DDEFE5; --warn:#8A6410; --warn-soft:#F7EEDA;
    --nav-bg:#231210; --nav-ink:#E6D4CD; --nav-ink-dim:#A98D83; --nav-active:#3D1E18; --nav-line:#3A1C16;
  }
  @media (prefers-color-scheme: dark){
    :root:not([data-theme="light"]){
      --bg:#140D0B; --surface:#1F1512; --sunk:#180F0D; --ink:#EFE6E1; --muted:#A99B93;
      --line:#382622; --line-soft:#2A1C19;
      --teal:#E08A6B; --teal-soft:#2E1A14; --teal-ink:#1E0D08;
      --copper:#EDA07A; --copper-soft:#33190F;
      --good:#63C79A; --good-soft:#12291F; --warn:#D3A84A; --warn-soft:#2A2517;
      --nav-bg:#1B0E0B; --nav-ink:#E3D2CB; --nav-ink-dim:#A2877D; --nav-active:#351A14; --nav-line:#2C1510;
    }
  }
  :root[data-theme="dark"]{
    --bg:#140D0B; --surface:#1F1512; --sunk:#180F0D; --ink:#EFE6E1; --muted:#A99B93;
    --line:#382622; --line-soft:#2A1C19;
    --teal:#E08A6B; --teal-soft:#2E1A14; --teal-ink:#1E0D08;
    --copper:#EDA07A; --copper-soft:#33190F;
    --good:#63C79A; --good-soft:#12291F; --warn:#D3A84A; --warn-soft:#2A2517;
    --nav-bg:#1B0E0B; --nav-ink:#E3D2CB; --nav-ink-dim:#A2877D; --nav-active:#351A14; --nav-line:#2C1510;
  }
  *{box-sizing:border-box}
  html,body{margin:0}
  body{background:var(--bg); color:var(--ink); font:15px/1.5 "Commissioner",system-ui,sans-serif;}
  h1,h2,h3,th,.ui,.tag,.btn,.chip,.nav a,.tab{font-family:"Golos Text",system-ui,sans-serif;}
  .num{font-family:"JetBrains Mono",ui-monospace,monospace; font-variant-numeric:tabular-nums;}
  .tag{font:600 10.5px/1.4 "Golos Text",sans-serif; letter-spacing:.08em; text-transform:uppercase; color:var(--muted);}

  .shell{display:grid; grid-template-columns:238px minmax(0,1fr); min-height:100%;}
  .shell > *{min-width:0; max-width:100%;}
  main{width:100%;}
  @media (max-width:900px){ .shell{grid-template-columns:1fr;} }

  .nav{background:var(--nav-bg); color:var(--nav-ink); padding:18px 14px calc(18px + env(safe-area-inset-bottom,0px));}
  .nav .brand{display:flex; align-items:baseline; gap:8px; padding:0 8px 16px; border-bottom:1px solid var(--nav-line); margin-bottom:12px;}
  .nav .brand b{font:700 17px/1 "Golos Text",sans-serif; color:#FFFFFF; letter-spacing:-0.01em;}
  .nav .brand span{font:600 10px/1 "Golos Text",sans-serif; letter-spacing:.1em; text-transform:uppercase; color:#E0885F;}
  .nav ul{list-style:none; margin:0; padding:0; display:flex; flex-direction:column; gap:2px;}
  .nav a{display:flex; justify-content:space-between; align-items:center; gap:8px; padding:9px 10px; border-radius:9px; color:var(--nav-ink); text-decoration:none; font:500 13.5px/1.2 "Golos Text",sans-serif; cursor:pointer;}
  .nav a small{font:600 10px/1 "Golos Text",sans-serif; color:var(--nav-ink-dim); letter-spacing:.06em;}
  .nav a:hover{background:var(--nav-active);}
  .nav a[aria-current="page"]{background:var(--nav-active); color:#FFFFFF;}
  .nav .navsec{padding:14px 10px 6px; color:var(--nav-ink-dim); font:600 10px/1 "Golos Text",sans-serif; letter-spacing:.12em; text-transform:uppercase;}
  @media (max-width:900px){
    .nav{position:sticky; top:0; z-index:5; padding:10px 0 0;}
    .nav .brand{padding:0 16px 10px;}
    .nav ul{flex-direction:row; overflow-x:auto; gap:4px; padding:0 12px 10px;}
    .nav .navsec{display:none;}
    .nav a{white-space:nowrap;}
    .nav a small{display:none;}
  }

  main{padding-inline:16px; padding-block:22px 44px; max-width:1180px;}
  .head{display:flex; flex-wrap:wrap; justify-content:space-between; align-items:flex-end; gap:12px; margin-bottom:16px;}
  h1{font-size:25px; font-weight:700; margin:0 0 3px; letter-spacing:-0.015em; text-wrap:balance;}
  .lede{color:var(--muted); margin:0; max-width:64ch;}
  h2{font-size:15px; font-weight:600; margin:0;}
  h3{font-size:13px; font-weight:600; margin:0 0 8px;}

  .panel{background:var(--surface); border:1px solid var(--line); border-radius:14px; overflow:hidden;}
  .panel > header{display:flex; flex-wrap:wrap; justify-content:space-between; align-items:center; gap:10px; padding:12px 14px; border-bottom:1px solid var(--line);}
  .pad{padding:14px;}
  .stack{display:flex; flex-direction:column; gap:16px;}
  .two{display:grid; grid-template-columns:minmax(0,1.5fr) minmax(0,1fr); gap:16px; align-items:start;}
  .even{display:grid; grid-template-columns:repeat(2,minmax(0,1fr)); gap:16px; align-items:start;}
  @media (max-width:880px){ .two,.even{grid-template-columns:1fr;} }

  .kpis{display:grid; grid-template-columns:repeat(4,minmax(0,1fr)); gap:12px;}
  @media (max-width:760px){ .kpis{grid-template-columns:repeat(2,minmax(0,1fr));} }
  .kpi{background:var(--surface); border:1px solid var(--line); border-radius:12px; padding:12px 14px;}
  .kpi small{color:var(--muted); font-size:12px;}
  .kpi b{display:block; font:600 21px/1.2 "JetBrains Mono",monospace; margin-top:6px; letter-spacing:-0.02em;}
  .kpi.alarm b{color:var(--copper);} .kpi.okv b{color:var(--good);}

  table{width:100%; border-collapse:collapse; font-size:14px;}
  .tablewrap{overflow-x:auto;}
  th{text-align:left; font-size:10.5px; font-weight:600; letter-spacing:.07em; text-transform:uppercase; color:var(--muted); padding:10px 12px; border-bottom:1px solid var(--line); white-space:nowrap;}
  td{padding:10px 12px; border-bottom:1px solid var(--line-soft); vertical-align:top;}
  tr:last-child td{border-bottom:0;}
  td.r,th.r{text-align:right;}
  td.r.num,td.r .num{white-space:nowrap;}
  tr.soon td{background:var(--warn-soft);}
  .sub{display:block; color:var(--muted); font-size:12px;}

  .chip{display:inline-block; font:600 10.5px/1 "Golos Text",sans-serif; letter-spacing:.05em; text-transform:uppercase; padding:5px 9px; border-radius:999px; border:1px solid var(--line); color:var(--muted); white-space:nowrap;}
  .chip.teal{border-color:var(--teal); color:var(--teal); background:var(--teal-soft);}
  .chip.ok{border-color:var(--good); color:var(--good); background:var(--good-soft);}
  .chip.hot{border-color:var(--copper); color:var(--copper); background:var(--copper-soft);}
  .chip.warn{border-color:var(--warn); color:var(--warn); background:var(--warn-soft);}

  .btn{border:1px solid var(--line); background:var(--surface); color:var(--ink); font:600 13px/1 "Golos Text",sans-serif; padding:10px 14px; border-radius:999px; cursor:pointer;}
  .btn:hover{border-color:var(--teal);}
  .btn.primary{background:var(--teal); border-color:var(--teal); color:var(--teal-ink);}
  .btn.cta{background:var(--copper); border-color:var(--copper); color:#FFFFFF;}
  .btn.small{padding:7px 11px; font-size:12px;}
  .btn:disabled{opacity:.42; cursor:not-allowed;}
  .row-btns{display:flex; flex-wrap:wrap; gap:8px;}
  button:focus-visible,a:focus-visible,input:focus-visible,select:focus-visible{outline:2px solid var(--teal); outline-offset:2px;}

  label{display:flex; flex-direction:column; gap:5px; font:600 10.5px/1.3 "Golos Text",sans-serif; letter-spacing:.07em; text-transform:uppercase; color:var(--muted);}
  input,select,textarea{font:400 15px/1.3 "Commissioner",sans-serif; color:var(--ink); background:var(--sunk); border:1px solid var(--line); border-radius:9px; padding:9px 10px; width:100%;}
  form.grid{display:grid; grid-template-columns:repeat(2,minmax(0,1fr)); gap:12px;}
  @media (max-width:560px){ form.grid{grid-template-columns:1fr;} }
  .span2{grid-column:1 / -1;}
  .switch{display:flex; flex-direction:row; align-items:center; gap:8px; font:600 12.5px/1.3 "Golos Text",sans-serif; color:var(--ink); text-transform:none; letter-spacing:0;}
  .switch input{width:auto;}
  .hint{font-size:12px; color:var(--muted);}

  .calc{background:var(--sunk); border:1px solid var(--line); border-radius:10px; padding:11px 12px; font-size:13.5px;}
  .calc .line{display:flex; justify-content:space-between; gap:10px; padding:3px 0;}
  .calc b{font-family:"JetBrains Mono",monospace;}

  /* chat */
  .chat{background:var(--sunk); height:min(58vh,470px); overflow-y:auto; padding:14px; display:flex; flex-direction:column; gap:8px;}
  .msg{max-width:88%; padding:9px 12px; border-radius:13px; border:1px solid var(--line); white-space:pre-wrap; background:var(--surface);}
  .msg.in{align-self:flex-start; border-bottom-left-radius:4px;}
  .msg.out{align-self:flex-end; border-bottom-right-radius:4px; background:var(--good-soft);}
  .msg .who{display:block; font:600 10px/1 "Golos Text",sans-serif; letter-spacing:.07em; text-transform:uppercase; color:var(--muted); margin-bottom:5px;}
  .msg .time{display:block; font-size:11px; color:var(--muted); margin-top:5px;}
  .card{background:var(--surface); border:1px solid var(--line); border-radius:10px; padding:10px; margin-top:8px;}
  .card .row{display:flex; justify-content:space-between; gap:12px; padding:5px 0; border-bottom:1px dashed var(--line);}
  .card .row:last-child{border-bottom:0;}
  .card .row.total{font-weight:600; border-top:1px solid var(--line); border-bottom:0; margin-top:4px; padding-top:8px;}
  .gone{color:var(--muted); text-decoration:line-through;}
  .suggest{text-align:left; width:100%; border:1px dashed var(--teal); background:var(--teal-soft); color:var(--ink); border-radius:12px; padding:10px 12px; cursor:pointer; font:inherit;}
  .suggest .tag{display:block; margin-bottom:4px; color:var(--teal);}

  /* shop */
  .shopgrid{display:grid; grid-template-columns:repeat(auto-fill,minmax(210px,1fr)); gap:12px;}
  .good{border:1px solid var(--line); border-radius:12px; padding:12px; background:var(--surface); display:flex; flex-direction:column; gap:8px;}
  .good .thumb{height:78px; border-radius:9px; border:1px solid var(--line-soft);}
  .good .price{font:600 17px/1 "JetBrains Mono",monospace;}
  .qtyrow{display:flex; align-items:center; gap:8px;}
  .qtyrow input{width:84px; text-align:right;}
  .cartline{display:flex; justify-content:space-between; gap:10px; padding:7px 0; border-bottom:1px dashed var(--line);}

  /* kanban */
  .board{display:grid; grid-template-columns:repeat(auto-fit,minmax(215px,1fr)); gap:12px;}
  .col{background:var(--sunk); border:1px solid var(--line); border-radius:12px; padding:10px; min-height:90px;}
  .col > .tag{display:flex; justify-content:space-between; margin-bottom:8px;}
  .ocard{background:var(--surface); border:1px solid var(--line); border-radius:10px; padding:10px; margin-bottom:8px;}
  .ocard b{font-size:13.5px;}
  .ocard .meta{display:flex; flex-wrap:wrap; gap:6px; margin-top:7px;}
  .ocard .acts{margin-top:9px;}
  .timer{font:600 15px/1 "JetBrains Mono",monospace; color:var(--teal);}
  .timer.low{color:var(--copper);}

  /* agent feed */
  .feed{background:var(--sunk); max-height:min(46vh,380px); overflow-y:auto; padding:12px; display:flex; flex-direction:column; gap:8px;}
  .say{background:var(--surface); border:1px solid var(--line); border-radius:12px; border-top-left-radius:4px; padding:10px 12px; font-size:14px;}
  .say.alert{border-color:var(--copper);} .say.good{border-color:var(--good);}
  .say .tag{display:block; margin-bottom:4px; color:var(--teal);}
  .say.alert .tag{color:var(--copper);}
  .asks{display:flex; flex-wrap:wrap; gap:6px;}
  .asks button{border:1px dashed var(--teal); background:var(--teal-soft); color:var(--ink); border-radius:999px; padding:7px 11px; font:500 12.5px/1 "Commissioner",sans-serif; cursor:pointer;}
  .askrow{display:flex; gap:8px;}

  /* architecture */
  .layer{border:1px solid var(--line); border-radius:12px; padding:12px 14px; background:var(--surface);}
  .layer + .layer{margin-top:10px;}
  .layer .tag{color:var(--copper);}
  .boxes{display:flex; flex-wrap:wrap; gap:8px; margin-top:9px;}
  .box{border:1px solid var(--line); border-radius:9px; padding:8px 11px; background:var(--sunk); font-size:13px;}
  .box b{display:block; font:600 12.5px/1.3 "Golos Text",sans-serif;}
  .box span{color:var(--muted); font-size:12px;}
  .arrow{text-align:center; color:var(--muted); font-size:16px; line-height:1; padding:4px 0;}
  .flow{display:flex; flex-wrap:wrap; gap:6px; align-items:center;}
  .flow .step{border:1px solid var(--teal); color:var(--teal); background:var(--teal-soft); border-radius:999px; padding:7px 12px; font:600 12px/1 "Golos Text",sans-serif;}
  .flow .sep{color:var(--muted);}

  .kv{display:flex; justify-content:space-between; gap:14px; padding:9px 14px; border-bottom:1px solid var(--line-soft); font-size:14px;}
  .kv:last-of-type{border-bottom:0;}
  .kv > span:first-child{color:var(--muted); flex:0 0 auto;}
  .kv > span:last-child{text-align:right;}
  ul.plain{list-style:none; margin:0; padding:0;}
  ul.plain li{display:flex; gap:10px; padding:9px 0; border-bottom:1px solid var(--line-soft); font-size:13.5px;}
  ul.plain li:last-child{border-bottom:0;}
  ul.plain time{font:400 12px/1.5 "JetBrains Mono",monospace; color:var(--muted); flex:0 0 auto;}
  .note{color:var(--muted); font-size:13px; max-width:74ch; margin-top:20px;}
  @media (prefers-reduced-motion:no-preference){ .msg,.say{animation:rise .18s ease-out;} }
  @keyframes rise{from{opacity:.4; transform:translateY(4px);} to{opacity:1; transform:none;}}
</style>

/* ============ утилиты ============ */
function good(id){ for(var i=0;i<GOODS.length;i++) if(GOODS[i].id===id) return GOODS[i]; return null; }
function point(id){ for(var i=0;i<POINTS.length;i++) if(POINTS[i].id===id) return POINTS[i]; return null; }
function client(id){ for(var i=0;i<S.clients.length;i++) if(S.clients[i].id===id) return S.clients[i]; return null; }
function batch(id){ for(var i=0;i<S.batches.length;i++) if(S.batches[i].id===id) return S.batches[i]; return null; }
function esc(s){ return String(s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;"); }
function kg(n,u){ return (Math.round(n*100)/100).toFixed(2).replace(".",",")+" "+(u||"кг"); }
function pctS(n){ return (Math.round(n*10)/10).toFixed(1).replace(".",",")+" %"; }
function money(n){ return Math.round(n).toLocaleString("ru-RU").replace(/ /g," ").replace(/,/g," ")+" ₸"; }
function stamp(){ S.clock += 3; var h=Math.floor(S.clock/60)%24, m=S.clock%60; return (h<10?"0":"")+h+":"+(m<10?"0":"")+m; }
function parseExp(s){ var p=s.split("."); return new Date(+p[1] >= 9 ? 2026 : 2027, +p[1]-1, +p[0]); }
function daysLeft(b){ return Math.round((parseExp(b.exp)-TODAY)/86400000); }
function livePoint(pid){ return S.batches.filter(function(b){ return b.left > 0.001 && b.point === pid; }); }
function stockOf(gid, pid){ var s=0; livePoint(pid||S.point).forEach(function(b){ if(b.good===gid) s+=b.left; }); return s; }
function fifo(gid, pid){ return livePoint(pid||S.point).filter(function(b){ return b.good===gid; })
  .sort(function(a,b){ return parseExp(a.exp)-parseExp(b.exp); }); }
function stockValue(pid){ var s=0; livePoint(pid||S.point).forEach(function(b){ s += b.left*b.cost; }); return s; }
function lossStats(pid){
  var inn=0, loss=0, po=0, pi=0;
  S.moves.forEach(function(m){
    if(pid && m.point !== pid) return;
    if(m.type==="Приёмка") inn += m.qty;
    if(m.type==="Списание" || m.type==="Недостача") loss += -m.qty;
    if(m.type==="Переработка"){ if(m.qty<0) po += -m.qty; else pi += m.qty; }
  });
  loss += (po - pi);
  return {in:inn, loss:loss, pct: inn ? loss/inn*100 : 0};
}
function orderSum(o){
  var s = 0;
  o.lines.forEach(function(l){ var g = good(l.good); s += g.price * (l.fact || l.qty); });
  return s + (o.status === "new" ? 0 : DELIVERY);
}
function agentSay(text, kind, head){
  S.agent.unshift({t:stamp(), text:text, kind:kind||"", head:head||"Агент"});
  if(S.agent.length > 40) S.agent.pop();
}

function answer(q){
  q = (q||"").toLowerCase();
  if(q.indexOf("остат")>=0 || q.indexOf("склад")>=0){
    var parts = [];
    GOODS.forEach(function(g){ var s = stockOf(g.id); if(s>0.001) parts.push(g.name+" – "+kg(s,g.unit)); });
    return point(S.point).name+": "+parts.join("; ")+". Итого "+money(stockValue())+" по себестоимости.";
  }
  if(q.indexOf("потер")>=0 || q.indexOf("списан")>=0){
    var l = lossStats(S.point);
    return "Приход "+kg(l.in)+", потери "+kg(l.loss)+" – это "+pctS(l.pct)+" при норме "+pctS(LOSS_NORM)+". "+(l.pct>LOSS_NORM?"Выше нормы, основной вклад дала переработка.":"В норме.");
  }
  if(q.indexOf("срок")>=0 || q.indexOf("испорт")>=0){
    var soon = livePoint(S.point).filter(function(b){ return daysLeft(b)<=6; });
    if(!soon.length) return "Ближайшую неделю ничего не истекает.";
    return soon.map(function(b){ return b.id+" "+good(b.good).name+", "+kg(b.left)+", "+(daysLeft(b)<=0?"срок вышел":"осталось "+daysLeft(b)+" дн."); }).join(". ")+". Предлагаю акцию минус 20 процентов.";
  }
  if(q.indexOf("маржа")>=0 || q.indexOf("прибыл")>=0){
    var rows = [];
    S.batches.forEach(function(b){
      if(b.point !== S.point) return;
      var g = good(b.good); if(!g.price) return;
      var sold = 0;
      S.moves.forEach(function(m){ if(m.batch===b.id && m.type==="Продажа") sold += -m.qty; });
      if(sold<=0) return;
      rows.push(b.id+" "+g.name+": продано "+kg(sold,g.unit)+", маржа "+money(sold*(g.price-b.cost)));
    });
    return rows.length ? rows.join(". ")+"." : "Продаж по партиям этой точки пока нет.";
  }
  if(q.indexOf("лид")>=0 || q.indexOf("заказ")>=0){
    var open = S.orders.filter(function(o){ return o.status!=="done" && o.status!=="lost"; });
    return "В работе "+open.length+" заказов. "+open.map(function(o){ return "№"+o.id+" – "+statusName(o.status); }).join(", ")+".";
  }
  if(q.indexOf("выход")>=0 || q.indexOf("цех")>=0){
    var y = S.yields[S.yields.length-1], norm = good(y.good).norm || 58;
    return "Последний акт "+y.date+": выход "+pctS(y.pct)+" при норме "+pctS(norm)+". "+(y.pct<norm-3?"Отклонение вниз – стоит проверить смену.":"В допуске.");
  }
  if(q.indexOf("сводк")>=0 || q.indexOf("как дела")>=0 || q.indexOf("смена")>=0){
    var l2 = lossStats(S.point), op = S.orders.filter(function(o){ return o.status!=="done" && o.status!=="lost"; });
    var soon2 = livePoint(S.point).filter(function(b){ return daysLeft(b)<=6; });
    return point(S.point).name+": остаток "+money(stockValue(S.point))+", в работе "+op.length+" заказов, потери "+pctS(l2.pct)+" при норме "+pctS(LOSS_NORM)+", партий на исходе срока – "+soon2.length+".";
  }
  return "Такого разреза в демо нет. Спросите про остатки, потери, сроки, маржу, лиды, выход цеха или сводку по смене.";
}
function statusName(s){
  return {new:"Новый лид", collecting:"Сборка", invoice:"Счёт выставлен", paid:"Оплачен", delivery:"Доставка", done:"Закрыт", lost:"Отвалился"}[s] || s;
}

function chatPush(who, text, card){
  S.chat.push({who:who, text:text, card:card||"", time:stamp()});
}
function chatAdvance(){
  var step = FLOW[S.chatStep];
  if(!step) return;
  if(step.who === "c" && S.stop && S.chatStep === 0){
    chatPush("c", step.t[S.lang]);
    chatPush("a", STOPMSG[S.lang]);
    agentSay("Клиент написал при закрытом приёме – агент перенёс заказ на завтра и поставил напоминание.", "alert", "Стоп-приём");
    S.chatStep = FLOW.length;
    render(); return;
  }
  chatPush(step.who, step.t[S.lang], step.card);
  if(step.fx) chatFx(step.fx);
  S.chatStep++;
  var nxt = FLOW[S.chatStep];
  if(nxt && nxt.who === "a" && !(nxt.gate === "weighed" && !S.chatWeighed)){
    chatPush(nxt.who, nxt.t[S.lang], nxt.card);
    if(nxt.fx) chatFx(nxt.fx);
    S.chatStep++;
  }
  render();
  var c = document.getElementById("chat"); if(c) c.scrollTop = c.scrollHeight;
}
function chatFx(fx){
  var o = chatOrder();
  if(fx === "reserve"){
    S.seqO++;
    var no = {id:String(S.seqO), point:"alm1", client:1, source:"whatsapp", status:"collecting", created:stamp(), wa:true,
      lines:[{good:"sudak",qty:2},{good:"leshch_s",qty:1.5},{good:"beer",qty:5}], reserve:30*60, sum:0};
    no.sum = orderSum(no);
    S.orders.unshift(no);
    reserveStock(no);
    agentSay("Заказ №"+no.id+" создан из переписки. Резерв на 30 минут, остаток уменьшен.", "", "Заказ");
  }
  if(fx === "pay" && o){ payOrder(o); }
  if(fx === "deliver" && o){ o.status = "delivery"; o.track = "Курьер назначен"; agentSay("Заявка в Яндекс Доставку создана, трек отправлен клиенту.", "good", "Доставка"); }
}

/* ============ склад: операции ============ */
function reserveStock(o){
  o.lines.forEach(function(l){
    var rest = l.qty;
    fifo(l.good, o.point).forEach(function(b){
      if(rest <= 0.001) return;
      var take = Math.min(rest, b.left);
      b.left -= take; rest -= take;
      S.moves.push({t:stamp()+" 19.09", point:o.point, type:"Резерв", good:l.good, batch:b.id, qty:-take, who:"Агент", note:"заказ №"+o.id});
    });
  });
}
function payOrder(o){
  o.status = "paid"; o.reserve = 0; o.sum = orderSum(o);
  o.lines.forEach(function(l){
    S.moves.push({t:stamp()+" 19.09", point:o.point, type:"Продажа", good:l.good, batch:"по резерву", qty:-(l.fact||l.qty), who:"Розница", note:"заказ №"+o.id});
  });
  agentSay("Оплата по заказу №"+o.id+" подтверждена – "+money(o.sum)+". Резерв закрыт, остаток списан по факту.", "good", "Kaspi");
}

/* ============ ВИД: весовая станция ============ */
function ean(gid, grams){
  var idx = 0; GOODS.forEach(function(g,i){ if(g.id===gid) idx = i+1; });
  var body = "2" + ("0000"+idx).slice(-4) + ("00000"+Math.min(99999, Math.round(grams))).slice(-5);
  var sum = 0;
  for(var i=0;i<body.length;i++) sum += (+body[i]) * (i%2 ? 3 : 1);
  return body + ((10 - sum%10) % 10);
}
function scaleOrders(){
  return S.orders.filter(function(o){ return o.status === "collecting" || o.status === "invoice"; });
}

  var list = scaleOrders();

  if(!o){
    return head + '<section class="panel"><div class="pad"><p class="hint">Сейчас нет заказов на сборке. Создайте заказ в разделе «WhatsApp-агент» или на витрине – он придёт сюда.</p></div></section>';

function costOf(gid, qty, pid){
  var rest = qty, c = 0;
  fifo(gid, pid).forEach(function(b){
    if(rest <= 0.001) return;
    var take = Math.min(rest, b.left); rest -= take; c += take*b.cost;
  });
  return c;
}
function bindScale(){
  bindAgent();
  var sel = document.getElementById("scale-order");
  if(sel) sel.addEventListener("change", function(){ S.scaleOrder = sel.value; render(); });
  var o = null;
  scaleOrders().forEach(function(x){ if(x.id === S.scaleOrder) o = x; });
  if(!o) return;

  function totals(){
    var box = document.getElementById("scale-total"); if(!box) return;
    box.innerHTML = "";
    var pre = 0, fin = 0, cost = 0, over = false;
    o.lines.forEach(function(l){
      var g = good(l.good), fact = (typeof l.fact === "number") ? l.fact : l.qty;
      pre += g.price*l.qty; fin += g.price*fact; cost += costOf(g.id, fact, o.point);
      if(l.qty && Math.abs((fact-l.qty)/l.qty*100) > TOLERANCE) over = true;
    });
    line(box, "Предварительно по заказу", money(pre));
    line(box, "По факту весов", money(fin));
    line(box, "Разница", (fin-pre>=0?"+":"−")+money(Math.abs(fin-pre)));
    line(box, "Доставка", money(DELIVERY));
    line(box, "Итого к оплате", money(fin + DELIVERY));
    line(box, "Себестоимость по партиям", money(cost));
    line(box, "Маржа", money(fin - cost) + " · " + pctS(fin ? (fin-cost)/fin*100 : 0));
    var h = document.createElement("div"); h.className = "hint";
    h.textContent = over ? "Одна из позиций вне допуска ±"+TOLERANCE+" процентов. Счёт выставляется только после подтверждения клиента."
      : "Все позиции в допуске – счёт можно выставлять сразу.";
    box.appendChild(h);
    var fix = document.getElementById("scale-fix");
    if(fix) fix.disabled = over && !o.confirmed;
    var ask = document.getElementById("scale-ask");
    if(ask) ask.disabled = !over || !!o.confirmed;
  }

  Array.prototype.forEach.call(document.querySelectorAll("[data-w]"), function(inp){
    inp.addEventListener("input", function(){
      var i = +inp.getAttribute("data-w"), l = o.lines[i], g = good(l.good);
      var v = parseFloat(inp.value); if(isNaN(v) || v < 0) v = 0;
      l.fact = v; o.confirmed = false;
      var dev = l.qty ? (v - l.qty)/l.qty*100 : 0, over = Math.abs(dev) > TOLERANCE;
      var d = document.querySelector('[data-dev="'+i+'"]'); if(d) d.textContent = (dev>=0?"+":"−")+pctS(Math.abs(dev));
      var c = document.querySelector('[data-chip="'+i+'"]');
      if(c){ c.className = "chip " + (over?"hot":"ok"); c.textContent = over ? "вне допуска" : "в допуске"; }
      var s = document.querySelector('[data-sum="'+i+'"]'); if(s) s.textContent = money(g.price*v);
      var e = document.querySelector('[data-ean="'+i+'"]'); if(e) e.textContent = ean(g.id, (g.unit==="кг"?v*1000:v*100));
      totals();
    });
  });

  var fix = document.getElementById("scale-fix");
  if(fix) fix.addEventListener("click", function(){
    o.lines.forEach(function(l){ if(typeof l.fact !== "number") l.fact = l.qty; });
    o.status = "invoice"; o.reserve = o.reserve || 30*60; o.sum = orderSum(o);
    if(o.wa) S.chatWeighed = true;
    var parts = o.lines.map(function(l){ return good(l.good).name+" "+kg(l.fact, good(l.good).unit); }).join(", ");
    agentSay("Заказ №"+o.id+": вес зафиксирован – "+parts+". Итог "+money(o.sum)+", счёт Kaspi ушёл клиенту.", "", "Развес");
    S.view = "orders"; render();
  });

  var ask = document.getElementById("scale-ask");
  if(ask) ask.addEventListener("click", function(){
    o.confirmed = true;
    var bad = o.lines.filter(function(l){ return l.qty && Math.abs(((l.fact||l.qty)-l.qty)/l.qty*100) > TOLERANCE; })
      .map(function(l){ return good(l.good).name+": просили "+kg(l.qty, good(l.good).unit)+", на весах "+kg(l.fact, good(l.good).unit); }).join("; ");
    if(o.wa){
      chatPush("a", "По весу вышло за допуск. "+bad+". Оставляем или подрезать до заказанного?");
      chatPush("c", "Оставляй, беру как есть");
    }
    agentSay("Клиенту отправлен запрос по весу: "+bad+". Ответ получен – берёт как есть. Счёт можно выставлять.", "good", "Развес");
    render();
  });

  var tare = document.getElementById("scale-tare");
  if(tare) tare.addEventListener("click", function(){
    o.lines.forEach(function(l){ l.fact = l.qty; });
    o.confirmed = false;
    render();
  });

  totals();
}

function line(box, label, value){

function numOf(id){ var el = document.getElementById(id); var v = el ? parseFloat(el.value) : 0; return isNaN(v) ? 0 : v; }
function bindWarehouse(){
  bindPointPicker(); bindAgent();
  function acceptCalc(){
    var box = document.getElementById("a-calc"); if(!box) return; box.innerHTML = "";
    var net = numOf("a-gross") - numOf("a-tare"), doc = numOf("a-doc");
    var diff = net - doc, dp = doc ? Math.abs(diff)/doc*100 : 0;
    line(box, "Нетто по весам", kg(net));
    line(box, "Расхождение с накладной", (diff>=0?"+":"−")+kg(Math.abs(diff))+" · "+pctS(dp));
    line(box, "Сумма партии", money(net*numOf("a-cost")));
    var h = document.createElement("div"); h.className = "hint";
    h.textContent = dp > 1 ? "Больше 1 процента – система оформит акт расхождения." : "В допуске, акт не нужен.";
    box.appendChild(h);
  }
  function prodCalc(){
    var box = document.getElementById("p-calc"); if(!box) return; box.innerHTML = "";
    var bsel = document.getElementById("p-batch"), b = bsel ? batch(bsel.value) : null;
    var inQ = numOf("p-in"), outQ = numOf("p-out");
    var rsel = document.getElementById("p-result"), res = rsel ? good(rsel.value) : null;
    var y = inQ ? outQ/inQ*100 : 0, norm = (res && res.norm) ? res.norm : 58;
    var cost = outQ ? inQ*(b?b.cost:0)/outQ : 0;
    line(box, "Выход", pctS(y)+" при норме "+pctS(norm));
    line(box, "Отход", kg(Math.max(0, inQ-outQ)));
    line(box, "Себестоимость готового", money(cost)+"/кг");
    if(res && res.price) line(box, "Маржа при "+money(res.price), pctS((res.price-cost)/res.price*100));
    var h = document.createElement("div"); h.className = "hint";
    h.textContent = y < norm-3 ? "Ниже нормы – агент поставит отметку на смену." : "В норме.";
    box.appendChild(h);
  }
  function saleCalc(){
    var box = document.getElementById("s-calc"); if(!box) return; box.innerHTML = "";
    var sel = document.getElementById("s-good"), g = sel ? good(sel.value) : null; if(!g) return;
    var need = numOf("s-qty"), rest = need, cost = 0, used = [];
    fifo(g.id, S.point).forEach(function(b){
      if(rest <= 0.001) return;
      var take = Math.min(rest, b.left); rest -= take; cost += take*b.cost;
      used.push(b.id+" – "+kg(take,g.unit));
    });
    line(box, "Списание по FIFO", used.length ? used.join(", ") : "нет остатка");
    line(box, "Себестоимость", money(cost));
    if(document.getElementById("s-kind").value === "sale" && g.price){
      var rev = need*g.price;
      line(box, "Выручка", money(rev));
      line(box, "Маржа", money(rev-cost)+" · "+pctS(rev ? (rev-cost)/rev*100 : 0));
    }
  }
  function invCalc(){
    var box = document.getElementById("i-calc"); if(!box) return; box.innerHTML = "";
    var sel = document.getElementById("i-good"), g = sel ? good(sel.value) : null; if(!g) return;
    var book = stockOf(g.id, S.point), fact = numOf("i-qty"), diff = fact - book;
    var w = 0, c = 0; fifo(g.id, S.point).forEach(function(b){ c += b.cost*b.left; w += b.left; });
    var avg = w ? c/w : 0;
    line(box, "По учёту", kg(book,g.unit));
    line(box, "По факту", kg(fact,g.unit));
    line(box, diff < 0 ? "Недостача" : diff > 0 ? "Излишек" : "Расхождение", diff ? (diff>0?"+":"−")+kg(Math.abs(diff),g.unit)+" · "+money(Math.abs(diff)*avg) : "нет");
  }
  ["a-gross","a-tare","a-doc","a-cost"].forEach(function(id){ var e=document.getElementById(id); if(e) e.addEventListener("input", acceptCalc); });
  ["p-in","p-out"].forEach(function(id){ var e=document.getElementById(id); if(e) e.addEventListener("input", prodCalc); });
  ["p-batch","p-result"].forEach(function(id){ var e=document.getElementById(id); if(e) e.addEventListener("change", prodCalc); });
  var sq = document.getElementById("s-qty"); if(sq) sq.addEventListener("input", saleCalc);
  ["s-good","s-kind"].forEach(function(id){ var e=document.getElementById(id); if(e) e.addEventListener("change", saleCalc); });
  var iq = document.getElementById("i-qty"); if(iq) iq.addEventListener("input", invCalc);
  var ig = document.getElementById("i-good"); if(ig) ig.addEventListener("change", invCalc);
  acceptCalc(); prodCalc(); saleCalc(); invCalc();

  var fa = document.getElementById("f-accept");
  if(fa) fa.addEventListener("submit", function(e){
    e.preventDefault();
    var gid = document.getElementById("a-good").value, g = good(gid);
    var net = numOf("a-gross") - numOf("a-tare"), doc = numOf("a-doc");
    if(net <= 0){ agentSay("Нетто получилось нулевым. Проверьте брутто и тару.", "alert", "Приёмка"); render(); return; }
    var dp = doc ? Math.abs(net-doc)/doc*100 : 0;
    S.seqB++;
    var exp = new Date(TODAY.getTime() + g.shelf*86400000);
    var nb = {id:"П-"+S.seqB, point:S.point, good:gid, in:net, left:net, cost:numOf("a-cost"),
      supplier:document.getElementById("a-supplier").value || "без поставщика",
      inv:document.getElementById("a-invoice").value || "—", date:"19.09",
      exp:("0"+exp.getDate()).slice(-2)+"."+("0"+(exp.getMonth()+1)).slice(-2)};
    S.batches.push(nb);
    S.moves.push({t:stamp()+" 19.09", point:S.point, type:"Приёмка", good:gid, batch:nb.id, qty:net, who:"Асхат"});
    agentSay("Принял "+nb.id+": "+g.name+", "+kg(net,g.unit)+" по "+money(nb.cost)+" за "+g.unit+", на "+money(net*nb.cost)+".", "", "Приёмка");
    if(dp > 1) agentSay("Накладная № "+nb.inv+": по документу "+kg(doc)+", по весам "+kg(net)+", расхождение "+pctS(dp)+". Оформил акт и отправил поставщику.", "alert", "Акт расхождения");
    else agentSay("Расхождение с накладной "+pctS(dp)+" – в допуске.", "good", "Приёмка");
    render();
  });

  var fp = document.getElementById("f-prod");
  if(fp) fp.addEventListener("submit", function(e){
    e.preventDefault();
    var b = batch(document.getElementById("p-batch").value);
    var inQ = numOf("p-in"), outQ = numOf("p-out");
    var res = good(document.getElementById("p-result").value);
    if(!b || !res){ agentSay("Выберите партию сырья и результат.", "alert", "Цех"); render(); return; }
    if(inQ > b.left + 0.001){ agentSay("В партии "+b.id+" только "+kg(b.left)+". Уменьшите вход.", "alert", "Цех"); render(); return; }
    if(outQ > inQ){ agentSay("Выход больше входа – так не бывает, проверьте весы.", "alert", "Цех"); render(); return; }
    var y = inQ ? outQ/inQ*100 : 0, norm = res.norm || 58, cost = outQ ? inQ*b.cost/outQ : 0;
    b.left -= inQ; S.seqB++;
    var exp = new Date(TODAY.getTime() + res.shelf*86400000);
    S.batches.push({id:"П-"+S.seqB, point:S.point, good:res.id, in:outQ, left:outQ, cost:Math.round(cost),
      supplier:"своё производство", inv:"акт "+(14+S.yields.length), date:"19.09",
      exp:("0"+exp.getDate()).slice(-2)+"."+("0"+(exp.getMonth()+1)).slice(-2)});
    S.moves.push({t:stamp()+" 19.09", point:S.point, type:"Переработка", good:b.good, batch:b.id, qty:-inQ, who:"Цех"});
    S.moves.push({t:stamp()+" 19.09", point:S.point, type:"Переработка", good:res.id, batch:"П-"+S.seqB, qty:outQ, who:"Цех"});
    S.yields.push({good:res.id, pct:y, date:"19.09"});
    agentSay("Акт проведён: "+kg(inQ)+" сырья дали "+kg(outQ)+" готового. Выход "+pctS(y)+", себестоимость "+money(cost)+" за кг.", "", "Цех");
    if(y < norm-3) agentSay("Выход "+pctS(y)+" против нормы "+pctS(norm)+". Разница "+kg(inQ*(norm-y)/100)+" – это "+money(inQ*(norm-y)/100*res.price)+" по цене продажи. Отметил смену.", "alert", "Отклонение");
    render();
  });

  var fs = document.getElementById("f-sale");
  if(fs) fs.addEventListener("submit", function(e){
    e.preventDefault();
    var g = good(document.getElementById("s-good").value);
    var need = numOf("s-qty"), kind = document.getElementById("s-kind").value;
    if(!g || need <= 0){ agentSay("Укажите вес больше нуля.", "alert", "Склад"); render(); return; }
    if(need > stockOf(g.id, S.point) + 0.001){ agentSay("На складе "+kg(stockOf(g.id,S.point),g.unit)+" – больше провести нельзя. Остаток правится только документом.", "alert", "Склад"); render(); return; }
    var rest = need, cost = 0, used = [];
    fifo(g.id, S.point).forEach(function(b){
      if(rest <= 0.001) return;
      var take = Math.min(rest, b.left);
      b.left -= take; rest -= take; cost += take*b.cost;
      used.push(b.id+" – "+kg(take,g.unit));
      S.moves.push({t:stamp()+" 19.09", point:S.point, type: kind==="sale"?"Продажа":"Списание", good:g.id, batch:b.id, qty:-take, who: kind==="sale"?"Розница":"Мурат", note: kind==="sale"?"":"брак или усушка"});
    });
    if(kind === "sale"){
      var rev = need*g.price;
      agentSay("Продажа "+kg(need,g.unit)+" "+g.name+". FIFO: "+used.join(", ")+". Себестоимость "+money(cost)+", выручка "+money(rev)+", маржа "+money(rev-cost)+".", "", "Продажа");
    } else {
      agentSay("Списание "+kg(need,g.unit)+" "+g.name+" на "+money(cost)+". FIFO: "+used.join(", ")+".", "alert", "Списание");
      var l = lossStats(S.point);
      if(l.pct > LOSS_NORM) agentSay("Потери с начала месяца "+pctS(l.pct)+" при норме "+pctS(LOSS_NORM)+". Пора смотреть причины.", "alert", "Потери");
    }
    render();
  });

  var fi = document.getElementById("f-inv");
  if(fi) fi.addEventListener("submit", function(e){
    e.preventDefault();
    var g = good(document.getElementById("i-good").value);
    if(!g) return;
    var fact = numOf("i-qty"), book = stockOf(g.id, S.point), diff = fact - book;
    var who = document.getElementById("i-who").value;
    if(Math.abs(diff) < 0.005){ agentSay("Пересчёт "+g.name+": расхождений нет, "+kg(fact,g.unit)+".", "good", "Инвентаризация"); render(); return; }
    var rest = Math.abs(diff), cost = 0;
    if(diff < 0){
      fifo(g.id, S.point).forEach(function(b){
        if(rest <= 0.001) return;
        var take = Math.min(rest, b.left);
        b.left -= take; rest -= take; cost += take*b.cost;
        S.moves.push({t:stamp()+" 19.09", point:S.point, type:"Недостача", good:g.id, batch:b.id, qty:-take, who:who, note:"инвентаризация"});
      });
      agentSay("Недостача "+kg(Math.abs(diff),g.unit)+" по позиции "+g.name+" на "+money(cost)+". Записал на смену: "+who+".", "alert", "Инвентаризация");
    } else {
      var list = fifo(g.id, S.point), last = list[list.length-1];
      if(last){ last.left += rest;
        S.moves.push({t:stamp()+" 19.09", point:S.point, type:"Излишек", good:g.id, batch:last.id, qty:rest, who:who, note:"инвентаризация"});
      }
      agentSay("Излишек "+kg(diff,g.unit)+" по позиции "+g.name+". Обычно это недовес при отпуске – проверьте весы на прилавке.", "alert", "Инвентаризация");
    }
    render();
  });
}

    box.appendChild(h);
  }
  ["m-qty","m-got"].forEach(function(id){ var e = document.getElementById(id); if(e) e.addEventListener("input", calc); });
  calc();
  var f = document.getElementById("f-move");
  if(f) f.addEventListener("submit", function(e){
    e.preventDefault();
    var from = document.getElementById("m-from").value, toP = document.getElementById("m-to").value;
    var gid = document.getElementById("m-good").value, g = good(gid);
    var sent = numOf("m-qty"), got = numOf("m-got");
    if(from === toP){ agentSay("Откуда и куда – одна и та же точка.", "alert", "Перемещение"); render(); return; }
    if(sent > stockOf(gid, from) + 0.001){ agentSay("На точке «"+point(from).name+"» только "+kg(stockOf(gid,from),g.unit)+".", "alert", "Перемещение"); render(); return; }
    var rest = sent, cost = 0;
    fifo(gid, from).forEach(function(b){
      if(rest <= 0.001) return;
      var take = Math.min(rest, b.left); b.left -= take; rest -= take; cost += take*b.cost;
      S.moves.push({t:stamp()+" 19.09", point:from, type:"Перемещение", good:gid, batch:b.id, qty:-take, who:point(from).manager, note:"в "+point(toP).name});
    });
    S.seqB++;
    var exp = new Date(TODAY.getTime() + g.shelf*86400000);
    S.batches.push({id:"П-"+S.seqB, point:toP, good:gid, in:got, left:got, cost: got ? Math.round(cost/got) : 0,
      supplier:"перемещение с "+point(from).name, inv:"пер-"+S.seqB, date:"19.09",
      exp:("0"+exp.getDate()).slice(-2)+"."+("0"+(exp.getMonth()+1)).slice(-2)});
    S.moves.push({t:stamp()+" 19.09", point:toP, type:"Приёмка", good:gid, batch:"П-"+S.seqB, qty:got, who:point(toP).manager, note:"перемещение"});
    if(got < sent - 0.005) agentSay("Перемещение: отправлено "+kg(sent,g.unit)+", принято "+kg(got,g.unit)+". Недостача "+kg(sent-got,g.unit)+" висит на «"+point(toP).name+"», ответственный "+point(toP).manager+".", "alert", "Перемещение");
    else agentSay("Перемещение проведено: "+kg(got,g.unit)+" ушло на «"+point(toP).name+"» без расхождений.", "good", "Перемещение");
    render();
  });
}

        "Яндекс Доставка":["good","API отвечает, за сутки 12 заявок. Алкоголь в заявку не проходит – ограничение сервиса."],
        "Весы с печатью этикетки":["alert","Весы не подключены. Вес вносится руками – риск опечаток в килограммах."],
        "AmoCRM":["alert","Связь есть, сделки создаются, но в воронку никто не заходит. Подробнее – кнопка диагностики ниже."]
      }[name] || ["","Проверка выполнена."];
      agentSay(res[1], res[0], name);
      render();
    });
  });
}
setInterval(function(){
  var changed = false;
  S.orders.forEach(function(o){
    if((o.status === "invoice" || o.status === "collecting") && o.reserve > 0){
      o.reserve -= 20;
      if(o.reserve <= 600 && !o.reminded){
        o.reminded = true;
        agentSay("Заказ №"+o.id+": до снятия резерва 10 минут. Напоминание об оплате отправлено.", "alert", "Напоминание");
        changed = true;
      }
      if(o.reserve <= 0){
        o.reserve = 0; o.status = "lost";
        o.lines.forEach(function(l){
          var list = fifo(l.good, o.point), b = list[0];
          if(b) b.left += l.fact || l.qty;
        });
        agentSay("Заказ №"+o.id+" не оплачен вовремя. Резерв снят, товар вернулся в остаток, клиенту ушло сообщение.", "alert", "Таймер");
        changed = true;
      }
      var el = document.querySelector('[data-timer="'+o.id+'"]');
      if(el && !changed){
        var m = Math.floor(o.reserve/60), s = o.reserve%60;
        el.textContent = (m<10?"0":"")+m+":"+(s<10?"0":"")+s;
        el.className = "timer" + (o.reserve <= 600 ? " low" : "");
      }
    }
  });
  if(changed) render();
}, 1000);

agentSay("Смена открыта. Остаток по точке "+money(stockValue("alm1"))+", в работе "+S.orders.length+" заказа.", "", "Старт");
agentSay("Партия П-1049 лещ х/к, 3,20 кг, срок через 5 дней. Предлагаю акцию минус 20 процентов – маржа останется 18 процентов.", "alert", "Сроки");
render();
})();
</script>
